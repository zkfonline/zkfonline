[build]
  publish = "."
  functions = "netlify/functions"

# The function itself declares its route (`export const config = { path: "/api/support" }`),
# so no redirect is needed to reach it.

# The publish directory is the repo root, so source and config files sit next
# to the site. `force = true` is essential here: without it Netlify serves an
# existing file and never reaches the rule. Verified — these return 200 without
# the flag.
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
